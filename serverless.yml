service: instagram-reels-workout
frameworkVersion: '>=4.0.0'

useDotenv: true

provider:
  name: aws
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-northeast-2'}
  profile: ${opt:aws-profile, 'developer-dongik'}
  memorySize: 512
  timeout: 15
  httpApi:
    cors: true
  environment:
    STAGE: ${sls:stage}
    TABLE_NAME: ${self:service}-table-${sls:stage}
    BUCKET_NAME: ${self:service}-media-${sls:stage}-${aws:accountId}
    QUEUE_URL: !Ref ReelsProcessingQueue
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    OPENAI_MODEL: ${env:OPENAI_MODEL, 'gpt-5.4-mini'}
    APP_SECRET_KEY: ${env:APP_SECRET_KEY, ''}
    ALLOWED_USER_EMAILS: ${env:ALLOWED_USER_EMAILS, ''}
  iam:
    role:
      statements:
        # DynamoDB Permissions
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt ReelsWorkoutTable.Arn
            - !Sub "${ReelsWorkoutTable.Arn}/index/*"

        # SQS Permissions
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt ReelsProcessingQueue.Arn

        # S3 Permissions
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Sub "arn:aws:s3:::${self:service}-media-${sls:stage}-${aws:accountId}/*"

functions:
  # 1. Ingest Handler (POST /reels)
  ingest:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.ingest.handler"]
    description: Validate Instagram Reel URL and enqueue processing job
    events:
      - httpApi:
          path: /reels
          method: post

  # 2. Asynchronous SQS Processor Worker
  processor:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.processor.handler"]
    description: Background worker processing Instagram Reels download, STT, and GPT-5.4 extraction
    timeout: 300
    memorySize: 1024
    events:
      - sqs:
          arn: !GetAtt ReelsProcessingQueue.Arn
          batchSize: 1
          maximumConcurrency: 2

  # 3. Get Job Status (GET /jobs/{job_id})
  getJob:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.jobs.get_job_status"]
    description: Polling endpoint for frontend client to check video processing progress
    events:
      - httpApi:
          path: /jobs/{job_id}
          method: get

  # 4. Get Workout Program by ID (GET /programs/{program_id})
  getProgram:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.programs.get_by_id"]
    description: Fetch extracted hierarchical workout program details
    events:
      - httpApi:
          path: /programs/{program_id}
          method: get

  # 5. List Programs by Creator (GET /programs)
  listPrograms:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.programs.list_by_creator"]
    description: Query workout programs by creator or list latest programs
    events:
      - httpApi:
          path: /programs
          method: get

  # 6. Update / Confirm Custom Program (PUT /programs/{program_id})
  updateProgram:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.programs.update_program"]
    description: Allow user to customize and confirm extracted exercises, sets, and weights
    events:
      - httpApi:
          path: /programs/{program_id}
          method: put

  # 7. Delete Program (DELETE /programs/{program_id})
  deleteProgram:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.programs.delete_by_id"]
    description: Delete workout program from library
    events:
      - httpApi:
          path: /programs/{program_id}
          method: delete

  # 8. Merge Series Programs (POST /programs/merge)
  mergePrograms:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.programs.merge_programs"]
    description: Merge multi-part reel programs (Part 1, Part 2, Part 3) into a single split
    timeout: 25
    memorySize: 512
    events:
      - httpApi:
          path: /programs/merge
          method: post

  # 9. AI Progressive Overload Predictor (GET /programs/{program_id}/next-session)
  getNextSession:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.programs.get_next_session"]
    description: AI calculation of target weights and reps for next session based on previous logs
    timeout: 20
    memorySize: 512
    events:
      - httpApi:
          path: /programs/{program_id}/next-session
          method: get

  # 10. AI Coach Query (POST /programs/{program_id}/coach-query)
  coachQuery:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.programs.coach_query"]
    description: Contextual strength & conditioning coaching answers for imported routines
    timeout: 20
    memorySize: 512
    events:
      - httpApi:
          path: /programs/{program_id}/coach-query
          method: post

  # 11. Exercise Substitution (POST /exercises/substitute)
  substituteExercise:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.exercises.substitute_exercise"]
    description: Suggest 3 biomechanically matched alternative exercises for crowded/missing gym gear
    timeout: 20
    memorySize: 512
    events:
      - httpApi:
          path: /exercises/substitute
          method: post

  # 12. Log Live Workout Session (POST /sessions)
  createSession:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.sessions.create_session"]
    description: Log actual executed workout session data (weight, reps, RPE) and calculate Planfit volume
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /sessions
          method: post

  # 13. Save In-Progress Workout Draft (PUT /sessions/active)
  saveActiveSession:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.sessions.save_active_session"]
    description: Save/update real-time workout checklist state as user checks sets
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /sessions/active
          method: put

  # 14. Get In-Progress Workout Draft (GET /sessions/active)
  getActiveSession:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.sessions.get_active_session"]
    description: Retrieve in-progress active workout draft to prompt resume dialog on app start
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /sessions/active
          method: get

  # 15. Discard/Cancel In-Progress Workout Draft (DELETE /sessions/active)
  deleteActiveSession:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.sessions.delete_active_session"]
    description: Discard or cancel active in-progress workout draft
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /sessions/active
          method: delete

  # 16. List Workout History (GET /sessions)
  listSessions:
    image:
      uri: 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest
      command: ["src.handlers.sessions.list_sessions"]
    description: List past workout session logs for progressive overload tracking
    timeout: 10
    memorySize: 256
    events:
      - httpApi:
          path: /sessions
          method: get

resources:
  Resources:
    # DynamoDB Single Table
    ReelsWorkoutTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_NAME}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1_PK
            AttributeType: S
          - AttributeName: GSI1_SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1_PK
                KeyType: HASH
              - AttributeName: GSI1_SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # SQS Dead Letter Queue
    ReelsProcessingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600 # 14 days

    # SQS Processing Queue
    ReelsProcessingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-queue-${sls:stage}
        VisibilityTimeout: 330 # Must exceed worker Lambda timeout (300s)
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ReelsProcessingDLQ.Arn
          maxReceiveCount: 3

    # S3 Media Bucket
    ReelsMediaBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.BUCKET_NAME}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: CleanupOldMedia
              Status: Enabled
              ExpirationInDays: 30
