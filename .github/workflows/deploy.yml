name: Deploy RepReel Backend to AWS ECR & Lambda

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to AWS (ap-northeast-2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run Tests
        run: |
          pip install uv
          uv pip install --system -r requirements.txt pytest
          pytest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        run: |
          docker build --platform linux/amd64 -t 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest .
          docker push 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest

      - name: Install Serverless Framework v3
        run: npm install -g serverless@3

      - name: Deploy to AWS via ECR Container Images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          ALLOWED_USER_EMAILS: ${{ secrets.ALLOWED_USER_EMAILS }}
        run: |
          serverless deploy --stage dev

      - name: Force Lambda functions to update to latest container image
        run: |
          FUNCTIONS=$(aws lambda list-functions --query "Functions[?starts_with(FunctionName, 'instagram-reels-workout-dev-')].FunctionName" --output text)
          for fn in $FUNCTIONS; do
            echo "Updating image for $fn..."
            aws lambda update-function-code --function-name "$fn" --image-uri 612529367436.dkr.ecr.ap-northeast-2.amazonaws.com/repreel-backend:latest || true
          done
