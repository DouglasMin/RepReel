name: Deploy RepReel Backend to AWS ECR & Lambda

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to AWS (ap-northeast-2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run Tests
        run: |
          pip install uv
          uv pip install --system -r requirements.txt pytest
          pytest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Deploy to AWS via ECR Container Images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          ALLOWED_USER_EMAILS: ${{ secrets.ALLOWED_USER_EMAILS }}
        run: |
          serverless deploy --stage dev
